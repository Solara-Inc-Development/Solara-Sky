[workspace]
resolver = "2"
members = [
    "crates/sky-protocol",
    "crates/sky-world",
    "crates/sky-api",
    "crates/sky-server",
    "tools/mc-codegen",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/solara-akksh/Solara-Sky"
rust-version = "1.85"

[workspace.dependencies]
aes = "0.8"
anyhow = "1"
bytes = "1"
cfb8 = "0.8"
cipher = "0.4"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hmac = "0.12"
md-5 = "0.10"
num-bigint = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = { version = "0.9", features = ["sha1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v3", "v4", "serde"] }

sky-protocol = { path = "crates/sky-protocol" }
sky-world = { path = "crates/sky-world" }
sky-api = { path = "crates/sky-api" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
